apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    project: roboshop
    environment: dev
    component: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      component: app1
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: app1
    spec:
      containers:
      - name: app1
        image: jayashankar1994/app1:1.0.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    project: roboshop
    environment: dev
    component: app1
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP